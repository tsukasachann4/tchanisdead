<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>tchan</title>

    <style>

        /* =====================================================
           ✦✦✦ EASY EDITING ✦✦✦
           ===================================================== */

        :root {
            --background: #000000;
            --text: #FCDCEC;
        }


        /* =====================================================
           GENERAL
           ===================================================== */

        body {
            margin: 0;
            min-height: 100vh;

            background-color: var(--background);
            color: var(--text);

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 90%;
            max-width: 1000px;

            text-align: center;
        }


        /* =====================================================
           MENU
           ===================================================== */

        #menu {
            display: block;
        }

        .menu-title {
            font-size: 32px;
            margin-bottom: 35px;
        }

        .menu-button {
            background: #000000;
            color: var(--text);

            border: 2px solid var(--text);

            padding: 10px 30px;

            font-family: "Courier New", monospace;
            font-size: 18px;

            cursor: pointer;
        }

        .menu-button:hover {
            background: var(--text);
            color: #000000;
        }


        /* =====================================================
           PASSWORD SCREEN
           ===================================================== */

        #password-screen {
            display: none;
        }

        .password-title {
            font-size: 22px;
            margin-bottom: 20px;
        }

        #password-display {
            width: 180px;

            margin: 0 auto 20px auto;
            padding: 10px;

            border: 1px solid var(--text);

            font-size: 24px;

            letter-spacing: 8px;

            min-height: 28px;
        }

        .keypad {
            display: grid;

            grid-template-columns: repeat(3, 60px);

            justify-content: center;

            gap: 8px;

            margin-top: 15px;
        }

        .key {
            width: 60px;
            height: 50px;

            background: #000000;
            color: var(--text);

            border: 1px solid var(--text);

            font-family: "Courier New", monospace;
            font-size: 18px;

            cursor: pointer;
        }

        .key:hover {
            background: var(--text);
            color: #000000;
        }

        .clear-button {
            margin-top: 12px;

            background: #000000;
            color: var(--text);

            border: 1px solid var(--text);

            padding: 8px 20px;

            font-family: "Courier New", monospace;

            cursor: pointer;
        }

        .clear-button:hover {
            background: var(--text);
            color: #000000;
        }

        #password-message {
            margin-top: 15px;

            min-height: 20px;

            font-size: 14px;
        }


        /* =====================================================
           DIARY
           ===================================================== */

        #diary {
            display: none;
        }

        #diary-image {
            display: block;

            width: auto;
            height: auto;

            max-width: 100%;
            max-height: 75vh;

            margin: 0 auto;
        }


        /* =====================================================
           NAVIGATION
           ===================================================== */

        .navigation {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 25px;

            margin-top: 20px;
        }

        .nav-button {
            background: transparent;
            color: var(--text);

            border: none;

            font-family: "Courier New", monospace;
            font-size: 30px;

            cursor: pointer;

            padding: 5px 15px;
        }

        .nav-button:hover {
            color: #FFFFFF;
        }

        #page-number {
            color: var(--text);

            font-size: 16px;
        }


        /* =====================================================
           FINAL MESSAGE
           ===================================================== */

        #final-message {
            display: none;

            width: 100%;
            min-height: 300px;

            justify-content: center;
            align-items: center;

            cursor: pointer;
        }

        #final-text {
            color: var(--text);

            font-size: 22px;
            line-height: 2;

            white-space: pre-line;
        }

    </style>
</head>


<body>

    <div class="page">


        <!-- =================================================
             MENU
             ================================================= -->

        <div id="menu">

            <div class="menu-title">
                tchan
            </div>

            <button
                class="menu-button"
                onclick="openPassword()"
            >
                diary
            </button>

        </div>


        <!-- =================================================
             PASSWORD SCREEN
             ================================================= -->

        <div id="password-screen">

            <div class="password-title">
                password
            </div>

            <div id="password-display"></div>


            <div class="keypad">

                <button class="key" onclick="enterNumber('1')">
                    1
                </button>

                <button class="key" onclick="enterNumber('2')">
                    2
                </button>

                <button class="key" onclick="enterNumber('3')">
                    3
                </button>

                <button class="key" onclick="enterNumber('4')">
                    4
                </button>

                <button class="key" onclick="enterNumber('5')">
                    5
                </button>

                <button class="key" onclick="enterNumber('6')">
                    6
                </button>

                <button class="key" onclick="enterNumber('7')">
                    7
                </button>

                <button class="key" onclick="enterNumber('8')">
                    8
                </button>

                <button class="key" onclick="enterNumber('9')">
                    9
                </button>

                <button class="key" onclick="enterNumber('0')">
                    0
                </button>

            </div>


            <button
                class="clear-button"
                onclick="clearPassword()"
            >
                clear
            </button>

            <div id="password-message"></div>

        </div>


        <!-- =================================================
             DIARY
             ================================================= -->

        <div id="diary">

            <img
                id="diary-image"
                src="page1.png"
                alt="Diary page 1"
            >


            <div class="navigation">

                <button
                    class="nav-button"
                    onclick="previousPage()"
                >
                    &lt;
                </button>

                <span id="page-number">
                    1 / 5
                </span>

                <button
                    class="nav-button"
                    onclick="nextPage()"
                >
                    &gt;
                </button>

            </div>

        </div>


        <!-- =================================================
             FINAL MESSAGE
             ================================================= -->

        <div
            id="final-message"
            onclick="nextFinalMessage()"
        >

            <div id="final-text"></div>

        </div>


    </div>


    <script>

        /* =====================================================
           PASSWORD
           ===================================================== */

        const correctPassword = "520";

        let enteredPassword = "";


        function openPassword() {

            document.getElementById("menu").style.display = "none";

            document.getElementById("password-screen").style.display =
                "block";

            enteredPassword = "";

            updatePasswordDisplay();

        }


        function enterNumber(number) {

            if (enteredPassword.length >= 3) {
                return;
            }

            enteredPassword += number;

            updatePasswordDisplay();


            /* Check password automatically after 3 digits */

            if (enteredPassword.length === 3) {

                if (enteredPassword === correctPassword) {

                    setTimeout(function() {

                        openDiary();

                    }, 300);

                } else {

                    document.getElementById("password-message")
                        .textContent = "incorrect";

                    setTimeout(function() {

                        enteredPassword = "";

                        updatePasswordDisplay();

                        document.getElementById("password-message")
                            .textContent = "";

                    }, 700);

                }

            }

        }


        function updatePasswordDisplay() {

            let display = "";

            for (
                let i = 0;
                i < enteredPassword.length;
                i++
            ) {
                display += "•";
            }

            document.getElementById("password-display")
                .textContent = display;

        }


        function clearPassword() {

            enteredPassword = "";

            updatePasswordDisplay();

            document.getElementById("password-message")
                .textContent = "";

        }


        /* =====================================================
           DIARY
           ===================================================== */

        let currentPage = 1;

        const totalPages = 5;


        function openDiary() {

            document.getElementById("password-screen").style.display =
                "none";

            document.getElementById("diary").style.display =
                "block";

            currentPage = 1;

            updateDiary();

        }


        function updateDiary() {

            document.getElementById("diary-image").src =
                "page" + currentPage + ".png";

            document.getElementById("diary-image").alt =
                "Diary page " + currentPage;

            document.getElementById("page-number").textContent =
                currentPage + " / " + totalPages;

        }


        function nextPage() {

            if (currentPage < totalPages) {

                currentPage++;

                updateDiary();

            } else {

                openFinalPage();

            }

        }


        function previousPage() {

            if (currentPage > 1) {

                currentPage--;

                updateDiary();

            }

        }


        /* =====================================================
           FINAL ATBASH MESSAGES
           ===================================================== */

        const finalMessages = [

            "r pmdv rg",

            "r'n hliib uli nzprmt blf wl zoo gsrh",

            "yfg r'n gifob gszmpufool",

            "mld r pml d dsb r xlfow lmob hnvoo gsv hvmt lu ilggmrt"

        ];


        let finalMessageIndex = 0;


        function openFinalPage() {

            document.getElementById("diary").style.display =
                "none";

            document.getElementById("final-message").style.display =
                "flex";

            finalMessageIndex = 0;

            document.getElementById("final-text").textContent =
                finalMessages[finalMessageIndex];

        }


        function nextFinalMessage() {

            finalMessageIndex++;

            if (finalMessageIndex >= finalMessages.length) {

                window.location.href =
                    "https://tsukasachann4.github.io/tsukasaishigh/";

                return;

            }

            document.getElementById("final-text").textContent =
                finalMessages[finalMessageIndex];

        }

    </script>

</body>
</html>
